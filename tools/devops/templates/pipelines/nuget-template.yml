parameters:
  - name: packages
    type: object
  - name: dotNetVersion
    type: string
    default: ""
  - name: dotNetRuntimes
    type: object
    default: []

variables:
  - template: ../../vars/vars.yml

stages:
  - template: ../stages/pack-template.yml
    parameters:
      vmImage: ${{ variables.vmImage }}
      dotNetVersion: ${{ coalesce(parameters.dotNetVersion, variables.dotNetVersion) }}
      dotNetRuntimes: ${{ parameters.dotNetRuntimes }}
      buildConfiguration: ${{ variables.buildConfiguration }}
      buildPlatform: ${{ variables.buildPlatform }}
      buildProjects: ${{ variables.buildProjects }}
      packages: ${{ parameters.packages }}
